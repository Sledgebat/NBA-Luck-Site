# Checks which NBA data sources answer from GitHub's servers (where the nightly updates will run).
# Runs by itself whenever the probe or this file is pushed, or from the Actions tab with "Run workflow".
# The report is in the run's log and saved as an artifact.
name: Probe data sources

on:
  push:
    branches: [main]
    paths:
      - "research/00_probe_sources.py"
      - ".github/workflows/probe-sources.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to a new version from 19 Oct 2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python research/00_probe_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: results/probe-*.json
