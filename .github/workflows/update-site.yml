# Fetches last night's NBA games from ESPN, updates the stats database and rebuilds the site's data.
# Three runs a night, like HockeyWeights. Times are UTC (Eastern is 4 hours behind until early
# November, then 5):
#
#   UTC     Eastern (Oct)   Eastern (Nov to mid-Mar)   Why
#   03:45   11:45 p.m.      10:45 p.m.                 after the East's games
#   06:30    2:30 a.m.       1:30 a.m.                 after the West's games
#   10:20    6:20 a.m.       5:20 a.m.                 morning pass: ESPN's overnight corrections
#
# If ESPN can't be reached, a game can't be read, or games stop arriving mid-season, the run
# fails and GitHub emails you. Nothing else alerts.
name: Update site

on:
  schedule:
    - cron: "45 3 * * *"
    - cron: "30 6 * * *"
    - cron: "20 10 * * *"
  workflow_dispatch:
    inputs:
      preseason:
        description: "Also take preseason games (rehearsal)"
        type: boolean
        default: false

permissions:
  contents: write # save the stats database between runs

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to a new version from 19 Oct 2026
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests

      - name: Download the saved stats database
        run: |
          mkdir -p db
          if gh release download data --pattern bucketweights.sqlite.gz --dir db --clobber; then
            gunzip -f db/bucketweights.sqlite.gz
            echo "Using the saved database."
          else
            echo "No saved database yet: loading the last three seasons (a few minutes)."
            python -m bucketweights.backfill 2024 2025 2026
          fi

      - name: Add new games and rebuild the data
        id: update
        run: |
          if [ "${{ inputs.preseason }}" = "true" ]; then
            python -m bucketweights.update --preseason
          else
            python -m bucketweights.update
          fi

      - name: Build the site
        run: python -m bucketweights.site

      - name: Install the browser for the social cards
        run: python -m playwright install --with-deps --only-shell chromium

      # The day's 1080 × 1350 images and captions, on the site at /social/. A problem with the cards
      # never stops the site going out.
      - name: Make the social cards
        id: cards
        continue-on-error: true
        run: python -m bucketweights.cards

      # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are added. Makes the
      # Pages project the first time. Only runs when the update worked, so a bad night never replaces
      # a good site.
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create bucketweights --production-branch=main > /dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy build/site --project-name=bucketweights --branch=main --commit-dirty=true

      # Saved even when the update reports a problem, so stored games are never fetched twice.
      - name: Save the stats database
        if: always() && hashFiles('db/bucketweights.sqlite') != ''
        run: |
          gzip -c db/bucketweights.sqlite > bucketweights.sqlite.gz
          gh release view data > /dev/null 2>&1 || gh release create data --title "Stats database" --notes "Saved automatically by the Update site workflow. Don't delete: it holds every stored game."
          gh release upload data bucketweights.sqlite.gz --clobber

      # The cards as a download on the run's page (sign in, scroll to Artifacts), until the site is live.
      - name: Keep the social cards
        if: steps.cards.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: social-cards
          path: build/site/social/*/*.png
          retention-days: 3
          if-no-files-found: ignore

      # Only when something went wrong, for a few days, so there's something to look at without
      # filling GitHub's artifact storage (free and unlimited while the repo is public; 500 MB
      # shared with HockeyWeights if it ever goes private).
      - name: Keep the site from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/
          retention-days: 3

      # GitHub pauses scheduled runs in repositories with no commits for 60 days.
      - name: Keep scheduled updates switched on
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled site updates running"
            git push
          fi
